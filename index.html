<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Happy Girlfriend's Day ❤️</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,600;0,800;1,400&display=swap" rel="stylesheet">

  <style>
    /* ---------- STRICT ONE PAGE LOCK ---------- */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100vw;
      height: 100vh;
      overflow: hidden; /* ABSOLUTELY NO SCROLLING */
      font-family: 'Montserrat', sans-serif;
      background: #080806;
      color: #f5f5f5;
      position: relative;
    }

    /* ---------- STARS & AMBIENCE ---------- */
    .bg-stars {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      background-image: 
        radial-gradient(circle, rgba(255, 255, 255, 0.8) 1px, transparent 1px),
        radial-gradient(circle, rgba(255, 215, 0, 0.3) 1px, transparent 1px);
      background-size: 160px 160px, 240px 240px;
      animation: twinkle 6s infinite alternate ease-in-out;
    }

    .ambient-glow {
      position: absolute;
      top: 15%;
      left: 50%;
      transform: translate(-50%, -15%);
      width: 500px;
      height: 500px;
      background: radial-gradient(circle, rgba(219, 184, 0, 0.12) 0%, transparent 70%);
      pointer-events: none;
      z-index: 0;
    }

    @keyframes twinkle {
      from { opacity: 0.3; }
      to { opacity: 0.8; }
    }

    /* ---------- INTRO OVERLAY ---------- */
    .intro {
      position: fixed;
      inset: 0;
      background: #000;
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 9999;
      transition: opacity 1s ease, visibility 1s ease;
    }

    .intro h2 {
      font-family: 'Playfair Display', serif;
      font-size: 28px;
      letter-spacing: 0.4em;
      color: #ffd54a;
      text-transform: lowercase;
      animation: pulse 2s infinite ease-in-out;
    }

    .intro.hide {
      opacity: 0;
      visibility: hidden;
    }

    @keyframes pulse {
      0%, 100% { opacity: 0.4; }
      50% { opacity: 1; }
    }

    /* ---------- TOP CONTENT (TEXT AREA) ---------- */
    .header-content {
      position: absolute;
      top: 6%;
      left: 50%;
      transform: translateX(-50%);
      width: 90%;
      max-width: 800px;
      text-align: center;
      z-index: 20;
      pointer-events: none;
    }

    .date {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.5em;
      color: #ffd54a;
      margin-bottom: 12px;
      text-transform: uppercase;
    }

    h1 {
      font-family: 'Playfair Display', serif;
      font-size: clamp(2.4rem, 5.5vw, 4.2rem);
      font-weight: 800;
      line-height: 1.1;
      color: #ffffff;
      margin-bottom: 8px;
      letter-spacing: -0.02em;
    }

    .name-badge {
      display: inline-block;
      font-size: 13px;
      letter-spacing: 0.4em;
      color: #d4a373;
      margin-bottom: 20px;
      text-transform: uppercase;
    }

    .subtitle {
      font-size: 15px;
      line-height: 1.7;
      font-weight: 300;
      color: #e0e0e0;
      max-width: 620px;
      margin: 0 auto;
    }

    .click-hint {
      display: block;
      margin-top: 15px;
      font-size: 11px;
      color: #ffd54a;
      letter-spacing: 0.15em;
      opacity: 0.8;
    }

    /* ---------- IMAGINARY CONTAINER FOR SUNFLOWERS (BOTTOM 35%) ---------- */
    .garden-box {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 38vh; /* Confines flowers strictly to the lower section */
      z-index: 10;
      pointer-events: none;
    }

    .sunflwr {
      width: 25vh;
      height: 25vh;
      position: absolute;
      bottom: 0;
      transform: translate(-50%, 0);
    }

    /* Stem grows inside the 38vh height only */
    .sunflwr__stem {
      position: absolute;
      transform: translate(-50%, 0%);
      width: 3.5%;
      height: 0%;
      background: linear-gradient(to top, #2d4218, #556D39);
      left: 50%;
      bottom: 0%;
      border-radius: 4px;
      animation: sunflwr__stem 1s cubic-bezier(.4,0,.2,1) forwards;
    }

    @keyframes sunflwr__stem {
      0% { height: 0%; }
      100% { height: 50%; }
    }

    .sunflwr__leaf--left {
      width: 0%;
      height: 18%;
      border-radius: 0% 50% 0% 50%;
      position: absolute;
      background: #556D39;
      top: 68%;
      left: 50%;
      transform: translate(-100%, -50%) rotate(-20deg);
      transform-origin: right center;
      animation: sunflwr__leaf--left 0.8s 0.7s forwards;
    }

    @keyframes sunflwr__leaf--left {
      0% { width: 0%; }
      100% { width: 22%; }
    }

    .sunflwr__leaf--right {
      width: 0%;
      height: 18%;
      border-radius: 50% 0% 50% 0%;
      position: absolute;
      background: #465b2e;
      top: 75%;
      left: 50%;
      transform: translate(0%, -50%) rotate(20deg);
      transform-origin: left center;
      animation: sunflwr__leaf--right 0.8s 0.8s forwards;
    }

    @keyframes sunflwr__leaf--right {
      0% { width: 0%; }
      100% { width: 22%; }
    }

    .sunflwr__center {
      border-radius: 50%;
      background: radial-gradient(circle, #522b07, #281303);
      transform: translate(-50%, -50%);
      position: absolute;
      left: 50%;
      top: 50%;
      z-index: 5;
      box-shadow: 0 0 10px rgba(0,0,0,0.5);
      animation: sunflwr__center 0.8s 1s forwards;
    }

    @keyframes sunflwr__center {
      0% { width: 0%; height: 0%; }
      100% { width: 28%; height: 28%; }
    }

    /* Back Row Petals */
    .sunflwr__pedal--1, .sunflwr__pedal--2, .sunflwr__pedal--3,
    .sunflwr__pedal--4, .sunflwr__pedal--5, .sunflwr__pedal--6 {
      border-radius: 50%;
      background: linear-gradient(to top, #fca311, #ffda3d);
      transform-origin: center center;
      position: absolute;
      left: 50%;
      top: 50%;
      z-index: 3;
      animation: grow-pedal-back 0.8s 1.2s forwards;
    }

    .sunflwr__pedal--1 { transform: translate(-50%, -50%) rotate(0deg); }
    .sunflwr__pedal--2 { transform: translate(-50%, -50%) rotate(30deg); }
    .sunflwr__pedal--3 { transform: translate(-50%, -50%) rotate(60deg); }
    .sunflwr__pedal--4 { transform: translate(-50%, -50%) rotate(90deg); }
    .sunflwr__pedal--5 { transform: translate(-50%, -50%) rotate(120deg); }
    .sunflwr__pedal--6 { transform: translate(-50%, -50%) rotate(150deg); }

    @keyframes grow-pedal-back {
      0% { width: 0%; height: 0%; }
      100% { width: 14%; height: 48%; }
    }

    /* Front Row Petals */
    .sunflwr__pedal--7, .sunflwr__pedal--8, .sunflwr__pedal--9,
    .sunflwr__pedal--10, .sunflwr__pedal--11, .sunflwr__pedal--12 {
      border-radius: 40% 60% 40% 60%;
      background: linear-gradient(to top, #ffb703, #fff066);
      transform-origin: center center;
      position: absolute;
      left: 50%;
      top: 50%;
      z-index: 4;
      animation: grow-pedal-front 0.8s 1.4s forwards;
    }

    .sunflwr__pedal--7  { transform: translate(-50%, -50%) rotate(15deg); }
    .sunflwr__pedal--8  { transform: translate(-50%, -50%) rotate(45deg); }
    .sunflwr__pedal--9  { transform: translate(-50%, -50%) rotate(75deg); }
    .sunflwr__pedal--10 { transform: translate(-50%, -50%) rotate(105deg); }
    .sunflwr__pedal--11 { transform: translate(-50%, -50%) rotate(135deg); }
    .sunflwr__pedal--12 { transform: translate(-50%, -50%) rotate(165deg); }

    @keyframes grow-pedal-front {
      0% { width: 0%; height: 0%; }
      100% { width: 11%; height: 38%; }
    }

    @media (max-width: 768px) {
      .header-content { top: 4%; }
      .subtitle { font-size: 13.5px; }
      .garden-box { height: 32vh; }
    }
  </style>
</head>
<body>

  <!-- INTRO SCREEN -->
  <div class="intro" id="intro">
    <h2>for maanya.</h2>
  </div>

  <!-- BACKGROUND AMBIENCE -->
  <div class="bg-stars"></div>
  <div class="ambient-glow"></div>

  <!-- HEADER TEXT (TOP HALF) -->
  <div class="header-content">
    <div class="date">01 August 2026</div>
    <h1>Happy Girlfriend's Day</h1>
    <div class="name-badge">— Maanya —</div>
    <p class="subtitle">
      Sunflowers spend their entire lives turning toward the light.<br>
      I never had to search for mine, because somehow I found it in you.
    </p>
    <span class="click-hint">(click anywhere to grow more sunflowers)</span>
  </div>

  <!-- IMAGINARY BOUNDED BOX FOR FLOWERS (BOTTOM HALF) -->
  <div class="garden-box" id="garden"></div>

  <script>
    // Hide Intro Overlay
    window.addEventListener('load', () => {
      setTimeout(() => {
        document.getElementById('intro').classList.add('hide');
      }, 1200);
    });

    const garden = document.getElementById('garden');

    function createSunflower(leftPosVw, sizeVh) {
      const flwr = document.createElement('div');
      flwr.className = 'sunflwr';
      flwr.style.left = `${leftPosVw}vw`;
      flwr.style.width = `${sizeVh}vh`;
      flwr.style.height = `${sizeVh}vh`;
      
      const brightness = 85 + Math.random() * 30;
      flwr.style.filter = `brightness(${brightness}%)`;

      flwr.innerHTML = `
        <div class="sunflwr__leaf--left"></div>
        <div class="sunflwr__leaf--right"></div>
        <div class="sunflwr__stem"></div>
        <div class="sunflwr__center"></div>
        <div class="sunflwr__pedal--1"></div>
        <div class="sunflwr__pedal--2"></div>
        <div class="sunflwr__pedal--3"></div>
        <div class="sunflwr__pedal--4"></div>
        <div class="sunflwr__pedal--5"></div>
        <div class="sunflwr__pedal--6"></div>
        <div class="sunflwr__pedal--7"></div>
        <div class="sunflwr__pedal--8"></div>
        <div class="sunflwr__pedal--9"></div>
        <div class="sunflwr__pedal--10"></div>
        <div class="sunflwr__pedal--11"></div>
        <div class="sunflwr__pedal--12"></div>
      `;
      garden.appendChild(flwr);
    }

    // Default flowers on launch inside the bounded box
    const initialPositions = [12, 32, 50, 68, 88];
    const initialSizes = [22, 28, 30, 26, 20]; // Sizes relative to vh

    initialPositions.forEach((pos, idx) => {
      setTimeout(() => {
        createSunflower(pos, initialSizes[idx]);
      }, idx * 180);
    });

    // Click anywhere to spawn extra sunflowers strictly inside the lower box
    document.addEventListener('click', (e) => {
      const clickX = (e.clientX / window.innerWidth) * 100;
      const randomSize = 20 + Math.random() * 10; 
      createSunflower(clickX, randomSize);
    });
  </script>
</body>
</html>
